services:
  - type: web
    name: casecraft
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 2 -k gthread --threads 8 --timeout 120 -b 0.0.0.0:$PORT server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 18.18.0
      - key: OPENAI_API_KEY
        sync: false
    plan: free
